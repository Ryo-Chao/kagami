<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kagami｜行動観察コーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans:wght@400;500;700&family=ZCOOL+XiaoWei&family=Shippori+Mincho:wght@500&family=Gowun+Batang&family=Fraunces:opsz,wght@9..144,500&display=swap">
<style>
/* 布局：顶部标签页（编码 / 行为表 / 结果 / 信度）。编码页左侧是视频或计时器 + 行为时间轴，右侧是按键面板和事件列表 */
:root {
  --bg: #eef0ec;
  --surface: #fbfbf9;
  --fg: #1d2630;
  --muted: #5b6874;
  --line: #d5dad2;
  --accent: #2f6a88;
  --warm: #d9a441;
  --warm-soft: rgba(217,164,65,.2);
  --ok: #3f7d4e;
  --warn: #9a4a2a;
  --font-display: "ZCOOL XiaoWei", "Songti SC", "STSong", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161b20; --surface: #1e252c; --fg: #e4e8ea; --muted: #9aa7b1; --line: #313b44;
    --accent: #6fa9c8; --warm: #e0b457; --warm-soft: rgba(224,180,87,.18); --ok: #7cc08b; --warn: #e39373; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161b20; --surface: #1e252c; --fg: #e4e8ea; --muted: #9aa7b1; --line: #313b44;
  --accent: #6fa9c8; --warm: #e0b457; --warm-soft: rgba(224,180,87,.18); --ok: #7cc08b; --warn: #e39373; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6; padding-inline: 16px; padding-block: 18px 48px; }
.wrap { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.85rem; margin: 0; letter-spacing: .04em; }
h2 { font-size: .95rem; font-weight: 700; margin: 0; }
h3 { font-size: .88rem; font-weight: 700; margin: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 1px solid transparent; background: transparent; padding: 6px 14px; border-radius: 99px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--fg); font-weight: 500; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px 12px; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 500; }
button.danger { color: var(--warn); }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=number], textarea, select { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 8px; width: 100%; }
label.field { display: flex; flex-direction: column; gap: 3px; font-size: .82rem; color: var(--muted); min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.help { color: var(--muted); font-size: .82rem; margin: 0; max-width: 76ch; }
.status { font-size: .84rem; margin: 0; min-height: 1.3em; }
.status.ok { color: var(--ok); } .status.err { color: var(--warn); }
.num { font-variant-numeric: tabular-nums; }

/* 编码页 */
.code-grid { display: grid; grid-template-columns: minmax(0,1fr) 330px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .code-grid { grid-template-columns: minmax(0,1fr); } }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 2px; gap: 2px; }
.modes button { border: 0; border-radius: 99px; padding: 4px 12px; background: transparent; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--bg); color: var(--fg); font-weight: 500; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.stage { background: #000; border-radius: var(--r); overflow: hidden; aspect-ratio: 16/9; max-width: 100%; display: grid; place-items: center; position: relative; }
.stage video { width: 100%; height: 100%; object-fit: contain; }
.stage canvas.roi { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.stage canvas.roi.drawing { pointer-events: auto; cursor: crosshair; touch-action: none; }
.stage .ph { color: #c9d0d6; padding: 20px; text-align: center; max-width: 44ch; margin: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.clock { background: var(--bg); border-radius: var(--r); padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.clock .big { font-size: 3rem; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1; }
.scanbox { width: 100%; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.scan-prompt { font-weight: 700; color: var(--fg); background: var(--warm-soft); border-radius: var(--r); padding: 6px 14px; }
.scan-prompt.idle { background: transparent; color: var(--muted); font-weight: 400; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls select { width: auto; }
.tc { font-variant-numeric: tabular-nums; margin-left: auto; color: var(--muted); font-size: .86rem; }
.tl-wrap { overflow-x: auto; }
canvas#timeline { width: 100%; display: block; background: var(--bg); border-radius: var(--r); cursor: pointer; }
.keys { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; }
.keybtn { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 8px; align-items: center; text-align: left; padding: 6px 8px; border-left: 4px solid var(--c, var(--line)); }
.keybtn kbd { font-family: inherit; font-size: .8rem; border: 1px solid var(--line); border-radius: 4px; text-align: center; padding: 0 4px; background: var(--bg); }
.keybtn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.keybtn .tp { grid-column: 2; font-size: .72rem; color: var(--muted); margin-top: -4px; }
.keybtn.on { background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--c); font-weight: 500; }
.evlist { max-height: 300px; overflow-y: auto; border-top: 1px solid var(--line); }
.evlist table { width: 100%; border-collapse: collapse; font-size: .82rem; }
.evlist td { padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.evlist input { width: 5.2em; padding: 2px 4px; font-size: .82rem; font-variant-numeric: tabular-nums; }
.evlist tr.sel { background: var(--warm-soft); }
.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: middle; }
.xbtn { border: 0; padding: 0 6px; color: var(--muted); background: transparent; }
.shortcuts { font-size: .74rem; color: var(--muted); line-height: 1.7; margin: 0; }

/* 行为表 */
.eth table { width: 100%; border-collapse: collapse; font-size: .86rem; }
.eth th, .eth td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.eth th { color: var(--muted); font-weight: 500; }
.eth td input[type=text] { min-width: 6em; }
.eth td.key input { width: 3.2em; text-align: center; }
.colors { display: flex; gap: 3px; flex-wrap: wrap; }
.colors button { width: 18px; height: 18px; padding: 0; border-radius: 50%; background: var(--c); border: 2px solid transparent; }
.colors button[aria-pressed="true"] { border-color: var(--fg); }
.table-wrap { overflow-x: auto; }

/* 结果 */
.res-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
table.data { border-collapse: collapse; width: 100%; font-size: .84rem; }
table.data th, table.data td { padding: 5px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.data th { color: var(--muted); font-weight: 500; }
table.data td.n, table.data th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.data tbody tr.pick { cursor: pointer; }
table.data tbody tr.pick:hover { background: var(--bg); }
table.data tbody tr.sel { background: var(--warm-soft); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stat { border-top: 2px solid var(--line); padding-top: 6px; min-width: 0; }
.stat b { display: block; font-size: 1.3rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: .78rem; }
.stat.hl { border-top-color: var(--warm); }
.matrix td.hot { background: var(--warm-soft); }
.empty { color: var(--muted); padding: 10px 0; margin: 0; }
.pre { border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.pre-params { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: end; }
.pre-params label.field { width: 130px; }
.pbar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--accent); }
.segnav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seginfo { font-size: .86rem; font-variant-numeric: tabular-nums; }
.seginfo b { font-weight: 500; }
.confirm { font-size: .84rem; color: var(--warn); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

:root[lang="ja"] { --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; }
:root[lang="ko"] { --font-display: "Gowun Batang", "AppleMyungjo", "Batang", serif; --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
:root[lang="en"] { --font-display: "Fraunces", Georgia, serif; --font-body: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
select.lang { width: auto; border-radius: 99px; padding: 4px 10px; }
.field-mode .keys { gap: 8px; }
.field-mode .keybtn { padding: 12px 10px; font-size: 1.05rem; min-height: 60px; }
.field-mode .keybtn kbd { font-size: .85rem; }
@media (max-width: 980px) { .field-mode .keybtn { min-height: 68px; } .field-mode .keybtn .tp { display: none; } }
.blindtog { border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; }
.blindtog:has(input:checked) { border-color: var(--warm); background: var(--warm-soft); }
.subjbar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.subjbar input { width: 9em; padding: 3px 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.schip { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 99px; padding: 1px 4px 1px 10px; font-size: .84rem; background: var(--surface); }
.schip[aria-pressed="true"] { border-color: var(--fg); background: var(--bg); font-weight: 500; }
.schip button { border: 0; background: transparent; padding: 0 5px; color: var(--muted); }
.schip .nm { cursor: pointer; }
.modpick { border: 1.5px solid var(--warm); background: var(--warm-soft); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.modpick .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.modpick .opts button { padding: 3px 10px; }
.modpick kbd { font-family: inherit; font-size: .76rem; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-right: 5px; background: var(--surface); }
.tbudget { display: flex; flex-direction: column; gap: 8px; }
.tbar { display: flex; height: 22px; border-radius: 4px; overflow: hidden; background: var(--line); }
.tbar span { display: block; height: 100%; min-width: 1px; }
.tlabel { font-size: .8rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.vars { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.varlist { display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
.varlist .row input { flex: 1; }
.lib-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
@media (max-width: 640px) { .flow { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.flow .stat b { font-size: 1.5rem; }
.reasons { font-size: .84rem; color: var(--muted); margin: 0; }
.method { background: var(--bg); border-radius: var(--r); padding: 10px 12px; font-size: .88rem; display: flex; flex-direction: column; gap: 6px; }
.method p { margin: 0; max-width: 80ch; }
.lib-filter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lib-filter button { font-size: .8rem; padding: 3px 10px; border-radius: 99px; }
.lib-filter button[aria-pressed="true"] { border-color: var(--fg); background: var(--bg); }
.lib-filter input { width: 14em; }
table.lib td { vertical-align: middle; }
table.lib td input[type=text] { min-width: 7em; padding: 3px 6px; font-size: .82rem; }
table.lib td input.url { min-width: 14em; }
table.lib td select { padding: 3px 6px; font-size: .82rem; width: auto; max-width: 13em; }
.chip { display: inline-block; font-size: .74rem; padding: 0 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.done { color: var(--ok); border-color: currentColor; }
.chip.part { color: var(--accent); border-color: currentColor; }
.chip.excl { color: var(--warn); border-color: currentColor; }
.chip.rel { color: var(--fg); background: var(--warm-soft); border-color: transparent; }
.nofile { font-size: .72rem; color: var(--muted); display: block; }
.vname-cell { max-width: 18em; overflow: hidden; text-overflow: ellipsis; }
</style>

<div class="wrap">
  <header>
    <h1 data-i18n="appTitle">行为观察编码器</h1>
    <div class="row">
      <nav class="tabs" role="tablist" data-i18n-aria="tabsAria" aria-label="页面">
        <button type="button" role="tab" aria-selected="true" data-tab="code" data-i18n="tabCode">编码</button>
        <button type="button" role="tab" aria-selected="false" data-tab="lib" data-i18n="tabLib">视频清单</button>
        <button type="button" role="tab" aria-selected="false" data-tab="eth" data-i18n="tabEth">行为表</button>
        <button type="button" role="tab" aria-selected="false" data-tab="res" data-i18n="tabRes">结果</button>
        <button type="button" role="tab" aria-selected="false" data-tab="rel" data-i18n="tabRel">信度</button>
      </nav>
      <label class="check small blindtog"><input type="checkbox" id="blind-toggle"> <span data-i18n="blindLabel">盲评模式</span></label>
      <select id="lang" class="lang" data-i18n-aria="langLabel" aria-label="语言">
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="ko">한국어</option>
      </select>
    </div>
  </header>

  <!-- ============ 编码 ============ -->
  <section id="tab-code" class="code-grid">
    <div class="panel">
      <div class="row" style="justify-content: space-between;">
        <div class="modes" role="group" data-i18n-aria="modesAria" aria-label="记录方式">
          <button type="button" data-mode="video" aria-pressed="true" data-i18n="modeVideo">看视频</button>
          <button type="button" data-mode="live" aria-pressed="false" data-i18n="modeLive">现场计时</button>
          <button type="button" data-mode="scan" aria-pressed="false" data-i18n="modeScan">瞬时取样</button>
        </div>
        <div class="row">
          <button type="button" id="next-video" data-i18n="nextVideo">下一个视频</button>
          <button type="button" id="new-session" data-i18n="newSession">新建记录</button>
        </div>
      </div>
      <div class="meta">
        <label class="field"><span data-i18n="coder">编码者</span><input type="text" id="coder" data-i18n-ph="coderPh" autocomplete="off"></label>
        <label class="field"><span data-i18n="subject">个体 / 对象</span><input type="text" id="subject" data-i18n-ph="subjectPh" autocomplete="off"></label>
        <label class="field"><span data-i18n="note">备注</span><input type="text" id="note" data-i18n-ph="notePh" autocomplete="off"></label>
      </div>
      <div class="vars" id="var-fields"></div>
      <div class="subjbar">
        <span class="small muted" data-i18n="subjLabel">同时记录的个体</span>
        <div class="chips" id="subj-chips"></div>
        <input type="text" id="subj-new" data-i18n-ph="subjAddPh" autocomplete="off">
        <button type="button" id="subj-add" data-i18n="subjAdd">添加</button>
        <span class="small muted" data-i18n="subjHint"></span>
      </div>

      <div id="video-box">
        <div class="stage" id="stage">
          <div class="ph" id="ph">
            <span data-i18n="phText">选择一个视频开始编码。</span>
            <button type="button" class="primary" id="pick-video" data-i18n="pickVideo">选择视频</button>
            <input type="file" id="video-input" accept="video/*" hidden>
          </div>
          <video id="player" playsinline hidden></video>
          <canvas class="roi" id="roi-layer" data-i18n-aria="roiAria" aria-label="roi"></canvas>
        </div>
      </div>

      <div id="clock-box" class="clock" hidden>
        <div class="big" id="clock">0:00.0</div>
        <div class="row">
          <button type="button" class="primary" id="clock-start" data-i18n="clockStart">开始计时</button>
          <button type="button" id="clock-pause" disabled data-i18n="pause">暂停</button>
          <button type="button" id="clock-end" disabled data-i18n="clockEnd">结束观察</button>
        </div>
        <div class="scanbox" id="scan-box" hidden>
          <div class="row small">
            <label class="row"><span data-i18n="scanEvery">每隔</span> <input type="number" id="scan-int" min="5" step="5" value="30" style="width:5em"> <span data-i18n="scanSec">秒</span></label>
            <label class="row"><span data-i18n="scanTotal">共</span> <input type="number" id="scan-n" min="1" step="1" value="20" style="width:5em"> <span data-i18n="scanTimes">次</span></label>
          </div>
          <div class="scan-prompt idle" id="scan-prompt" aria-live="assertive"></div>
        </div>
      </div>

      <div class="controls" id="video-controls">
        <button type="button" id="play" disabled data-i18n="play">播放</button>
        <button type="button" id="back" disabled data-i18n="back2" data-i18n-title="backTitle">−2 秒</button>
        <button type="button" id="fwd" disabled data-i18n="fwd2" data-i18n-title="fwdTitle">+2 秒</button>
        <select id="rate" data-i18n-aria="rateAria" aria-label="播放速度">
          <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option>
          <option value="2">2×</option><option value="4">4×</option>
        </select>
        <select id="zoom" data-i18n-aria="zoomAria" aria-label="时间轴范围">
          <option value="0" data-i18n="zoomAll">时间轴：全部</option><option value="300" data-i18n="zoom5m">5 分钟</option><option value="60" data-i18n="zoom1m">1 分钟</option><option value="20" data-i18n="zoom20">20 秒</option>
        </select>
        <span class="tc" id="tc">0:00.0 / 0:00.0</span>
      </div>
      <div class="pre" id="pre-box">
        <div class="row" style="justify-content: space-between;">
          <h3 data-i18n="preTitle">自动预切片</h3>
          <span class="small muted" id="pre-sum"></span>
        </div>
        <p class="help" data-i18n="preHelp"></p>
        <div class="pre-params">
          <label class="field"><span data-i18n="preThr">静止阈值</span><input type="number" id="pre-thr" min="0.1" step="0.1" value="1.5"></label>
          <label class="field"><span data-i18n="preMin">最短静止（秒）</span><input type="number" id="pre-min" min="1" step="1" value="5"></label>

const Logic = (() => {
  const round = (x, d = 2) => Math.round(x * 10 ** d) / 10 ** d;

  // 把事件整理成闭合区间：未结束的状态在 end 处截止
  function closed(events, end) {
    return events.map((e) => ({ ...e, e: e.e == null ? Math.max(e.s, end) : e.e }));
  }

  // subj 为 undefined 时表示全部个体
  const inSubj = (e, subj) => subj === undefined || subj === null || e.subj === subj;
  function modBreakdown(mine, b, dur) {
    if (!b.mods || !b.mods.length) return null;
    const out = {};
    for (const e of mine) {
      const k = e.mod || "";
      const o = out[k] || (out[k] = { count: 0, total: 0 });
      o.count++;
      if (b.type === "state") o.total += Math.max(0, Math.min(e.e, dur || e.e) - e.s);
    }
    return out;
  }
  function summarize(session, ethogram, subj) {
    const dur = session.duration || 0;
    const evs = closed((session.events || []).filter((e) => inSubj(e, subj)), dur);
    const rows = [];
    const scan = session.mode === "scan";
    const scanTotal = scan ? evs.filter((e) => e.scan).length : 0;
    for (const b of ethogram.behaviors) {
      const mine = evs.filter((e) => e.b === b.id).sort((x, y) => x.s - y.s);
      if (scan) {
        const n = mine.length;
        rows.push({ b, count: n, total: null, pct: scanTotal ? n / scanTotal : 0, latency: n ? mine[0].s : null, meanBout: null });
        continue;
      }
      if (b.type === "point") {
        rows.push({ b, count: mine.length, total: null, pct: null, latency: mine.length ? mine[0].s : null, meanBout: null, rate: dur ? mine.length / (dur / 60) : null, mods: modBreakdown(mine, b, dur) });

    drawLat(d, lName, rName);
  }
  function drawLat(d, lName, rName) {
    const cv = $("lat-plot"); if ($("tab-res").hidden) return;
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight; if (!w) return;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
    const pad = 24, x = (v) => pad + ((v + 1) / 2) * (w - pad * 2), axisY = h - 30;
    c.font = `11px ${css("--font-body")}`; c.fillStyle = css("--muted"); c.strokeStyle = css("--line");
    c.beginPath(); c.moveTo(x(-1), axisY); c.lineTo(x(1), axisY); c.stroke();
    for (const v of [-1, -0.5, 0, 0.5, 1]) {
      c.beginPath(); c.moveTo(x(v), axisY); c.lineTo(x(v), axisY + 4); c.stroke();
      const lb = v === 0 ? "0" : fmt2(v), tw = c.measureText(lb).width; c.fillText(lb, x(v) - tw / 2, axisY + 16);
    }
    c.setLineDash([3, 3]); c.beginPath(); c.moveTo(x(0), 6); c.lineTo(x(0), axisY); c.stroke(); c.setLineDash([]);
    c.fillText(`← ${rName}`, x(-1), 12);
    const lt = `${lName} →`; c.fillText(lt, x(1) - c.measureText(lt).width, 12);
    const colL = bById(eth.liLeft)?.color || css("--accent"), colR = bById(eth.liRight)?.color || css("--warn");
    d.xs.forEach((v, i) => {
      const y = 22 + ((i * 37) % Math.max(1, axisY - 44));
      c.globalAlpha = 0.85; c.fillStyle = v >= 0 ? colL : colR;
      c.beginPath(); c.arc(x(v), y + 8, 4.5, 0, Math.PI * 2); c.fill(); c.globalAlpha = 1;
    });
    const tt = d.tt;
    if (tt.n >= 2) {
      c.strokeStyle = css("--fg"); c.lineWidth = 2;
      c.beginPath(); c.moveTo(x(Math.max(-1, tt.lo)), axisY - 8); c.lineTo(x(Math.min(1, tt.hi)), axisY - 8); c.stroke();
      c.fillStyle = css("--fg"); c.fillRect(x(tt.mean) - 1.5, axisY - 16, 3, 16);
      c.lineWidth = 1;
    }
  }
  ["lat-coder", "lat-unit", "lat-excl"].forEach((id) => $(id).addEventListener("change", renderLat));
  window.addEventListener("resize", () => { if (latCache && !$("tab-res").hidden) renderLat(); });
  $("lat-copy").onclick = async () => { try { await navigator.clipboard.writeText($("lat-text").textContent); $("lat-copy").textContent = T("copied"); } catch {} };
  $("lat-export").onclick = async () => {
    const d = latData();
    const rows = [["unit", "videos", "left_s", "right_s", "laterality_index"]].concat(d.list.map((u) => [u.key, u.videos, Logic.round(u.L, 2), Logic.round(u.R, 2), u.li == null ? "" : Logic.round(u.li, 4)]));
    const text = toCSV(rows);
    await saveCSV("laterality", text);
  };

  // ---------- 信度样本 ----------
  let drawConfirm = false;
  $("rel-draw").onclick = async () => {
    const incl = libList().filter((v) => !v.excluded);
    if (!incl.length) { $("rel-draw-status").textContent = T("relDrawNone"); return; }
    if (incl.some((v) => v.relSample) && !drawConfirm) { drawConfirm = true; $("rel-draw-status").textContent = T("relDrawConfirm"); return; }
    drawConfirm = false;
    const pct = Math.min(100, Math.max(1, +$("rel-pct").value || 20));
    const n = Math.max(1, Math.round(incl.length * pct / 100));
    const shuffled = [...incl]; for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
    const pick = new Set(shuffled.slice(0, n).map((v) => v.name));
    for (const v of libList()) { const want = pick.has(v.name); if (!!v.relSample !== want) await putVideo({ ...v, relSample: want }); }
    $("rel-draw-status").textContent = T("relDrawDone", { n, m: incl.length });
    renderLib();
  };

  // ---------- 全部视频一起计算信度 ----------
  function renderPoolOptions() {
    fillCoderSelect($("pool-a"));
    fillCoderSelect($("pool-b"));
    if ($("pool-a").value === $("pool-b").value && $("pool-b").options.length > 1) $("pool-b").selectedIndex = $("pool-a").selectedIndex === 0 ? 1 : 0;
    const g = $("pool-group"), pg = g.value; g.textContent = "";
    [...new Set(eth.behaviors.filter((b) => b.type === "state").map((b) => b.group || ""))].forEach((x) => { const o = document.createElement("option"); o.value = x; o.textContent = gName(x); g.append(o); });
    if (pg) g.value = pg;
  }
  $("pool-run").onclick = () => {
    const out = $("pool-out"); out.textContent = "";
    const A = $("pool-a").value, B = $("pool-b").value;
    const msg = (x) => { const p = document.createElement("p"); p.className = "status err"; p.textContent = x; out.append(p); };
    if (A === B) return msg(T("poolSame"));
    const relOnly = $("pool-relonly").checked;
    const bin = Math.max(0.1, +$("pool-bin").value || 1), tol = Math.max(0, +$("pool-tol").value || 0), group = $("pool-group").value;
    const byVideo = new Map();
    for (const s of Object.values(sessions)) {
      if (s.mode !== "video" || !s.events?.length) continue;
      const c = s.coder || ""; if (c !== A && c !== B) continue;
      const v = videos[vidId(s.video)];
      if (v?.excluded) continue;
      if (relOnly && !v?.relSample) continue;
      const e = byVideo.get(s.video) || {}; e[c === A ? "a" : "b"] = s; byVideo.set(s.video, e);
    }
    const pairs = [...byVideo.entries()].filter(([, e]) => e.a && e.b).sort((x, y) => x[0].localeCompare(y[0], undefined, { numeric: true }));
    if (!pairs.length) return msg(T("poolNone"));
    const conf = {}; const per = []; const pts = {};
    for (const [name, e] of pairs) {
      const ua = unitsOf(e.a), ub = unitsOf(e.b);
      const common = ua.filter((x) => ub.includes(x));
      for (const subj of common) {
        const r = Logic.reliability(e.a, e.b, eth, group, bin, tol, subj);
        for (const [k, v] of Object.entries(r.confusion)) conf[k] = (conf[k] || 0) + v;
        per.push({ name: subj !== undefined ? `${name} · ${subj}` : name, k: r.kap?.k, po: r.kap?.po, n: r.kap?.n || 0 });
        for (const pr of r.pointRes) { const q = pts[pr.b.id] || { b: pr.b, a: 0, bn: 0, matched: 0 }; q.a += pr.a; q.bn += pr.bn; q.matched += pr.matched; pts[pr.b.id] = q; }
      }
    }
    const kap = Logic.kappaFromCounts(conf);
    const st = document.createElement("div"); st.className = "stats"; st.style.marginTop = "12px";
    const add = (v, l, hl) => { const d = document.createElement("div"); d.className = "stat" + (hl ? " hl" : ""); const b = document.createElement("b"); b.textContent = v; const sm = document.createElement("small"); sm.textContent = l; d.append(b, sm); st.append(d); };
    add(kap ? kap.k.toFixed(2) : "—", "Cohen's κ", true);
    add(kap ? (kap.po * 100).toFixed(1) + "%" : "—", T("agreement"));
    add(pairs.length, T("poolNVideos"));
    add(kap ? kap.n : 0, T("bins", { b: bin }));
    out.append(st);
    const note = document.createElement("p"); note.className = "help"; note.style.marginTop = "8px"; note.textContent = T("kappaNote"); out.append(note);
    // 各视频
    const h = document.createElement("h3"); h.textContent = T("poolPerVideo"); h.style.margin = "12px 0 6px";
    const wrap = document.createElement("div"); wrap.className = "table-wrap";
    const t = document.createElement("table"); t.className = "data";
    const thead = document.createElement("thead"); const hr = document.createElement("tr");
    [T("thVideo"), "κ", T("agreement"), T("poolBins")].forEach((c, i) => { const th = document.createElement("th"); th.textContent = c; if (i) th.className = "n"; hr.append(th); });
    thead.append(hr); t.append(thead);
    const tb = document.createElement("tbody");
    for (const r of per) {
      const tr = document.createElement("tr");
      [r.name, r.k == null ? "—" : r.k.toFixed(2), r.po == null ? "—" : (r.po * 100).toFixed(1) + "%", r.n].forEach((v, i) => { const td = document.createElement("td"); if (i) td.className = "n"; td.textContent = v; tr.append(td); });
      tb.append(tr);
    }
    t.append(tb); wrap.append(t); out.append(h, wrap);
    const pl = Object.values(pts);
    if (pl.length) {
      const h2 = document.createElement("h3"); h2.textContent = T("pointTitle", { t: tol }); h2.style.margin = "12px 0 6px";
      const t2 = document.createElement("table"); t2.className = "data";
      const th2 = document.createElement("thead"); const hr2 = document.createElement("tr");
      [T("colBehavior"), T("pA"), T("pB"), T("matched"), T("agreement")].forEach((c, i) => { const th = document.createElement("th"); th.textContent = c; if (i) th.className = "n"; hr2.append(th); });
      th2.append(hr2); t2.append(th2);
      const tb2 = document.createElement("tbody");
      for (const q of pl) {
        const ag = q.a + q.bn ? (2 * q.matched) / (q.a + q.bn) : null;
        const tr = document.createElement("tr");
        [bName(q.b), q.a, q.bn, q.matched, ag == null ? "—" : (ag * 100).toFixed(1) + "%"].forEach((v, i) => { const td = document.createElement("td"); if (i) td.className = "n"; td.textContent = v; tr.append(td); });
        tb2.append(tr);
      }
      t2.append(tb2);
      const w2 = document.createElement("div"); w2.className = "table-wrap"; w2.append(t2);
      out.append(h2, w2);
    }
  };

  // ---------- 备份与恢复 ----------
  function renderBackupInfo() {
    const t = ls.get("oc_last_backup");
    $("bk-last").textContent = t ? T("bkLast", { t: new Date(t).toLocaleString(loc(), { hour12: false }) }) : T("bkNever");
  }
  $("bk-export").onclick = async () => {
    const data = { app: "behavior-observation-coder", version: 1, exportedAt: new Date().toISOString(), ethogram: eth, sessions, videos };
    const text = JSON.stringify(data);
    const ok = await saveFile(`behavior_coder_backup_${stamp()}.json`, new Blob([text], { type: "application/json" }), text);
    if (ok) { ls.set("oc_last_backup", new Date().toISOString()); renderBackupInfo(); setStatus($("bk-status"), T("bkSaved", { n: Object.keys(sessions).length, v: Object.keys(videos).length }), "ok"); }
  };
  let bkConfirm = null;
  $("bk-import").onclick = () => $("bk-file").click();
  $("bk-file").onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch { return setStatus($("bk-status"), T("bkBad"), "err"); }
    if (data?.app !== "behavior-observation-coder" || typeof data.sessions !== "object") return setStatus($("bk-status"), T("bkBad"), "err");
    const replace = $("bk-replace").checked;
    if (replace && bkConfirm !== f.name) { bkConfirm = f.name; return setStatus($("bk-status"), T("bkConfirm"), "err"); }
    bkConfirm = null;
    await importBackup(data, replace);
  };
  async function importBackup(data, replace) {
    const st = $("bk-status");
    setStatus(st, T("bkWorking"));
    let nS = 0, nV = 0;
    try {
      // 行为表：替换时整体覆盖；合并时补上没有的行为和条件
      let newEth = eth;
      if (data.ethogram?.behaviors?.length) {
        if (replace) newEth = data.ethogram;
        else {
          newEth = JSON.parse(JSON.stringify(eth));
          for (const b of data.ethogram.behaviors) if (!newEth.behaviors.some((x) => x.id === b.id)) newEth.behaviors.push(b);
          newEth.vars = newEth.vars || [];
          for (const v of data.ethogram.vars || []) if (!newEth.vars.some((x) => x.id === v.id)) newEth.vars.push(v);
        }
        eth = newEth;
        if (db) await db.doc("config/ethogram").set(eth);
      }
      const newer = (a, b) => !a || String(b.updatedAt || "") >= String(a.updatedAt || "");
      if (replace) {
        for (const id of Object.keys(sessions)) if (!data.sessions[id]) { delete sessions[id]; if (db) await db.collection("sessions").doc(id).delete(); }
        for (const id of Object.keys(videos)) if (!data.videos?.[id]) { delete videos[id]; if (db) await db.collection("videos").doc(id).delete(); }
      }
      for (const [id, x] of Object.entries(data.sessions || {})) {
        if (!x || !Array.isArray(x.events)) continue;
        if (replace || newer(sessions[id], x)) { sessions[id] = x; if (db) await db.collection("sessions").doc(id).set(x); nS++; }
      }
      for (const [id, x] of Object.entries(data.videos || {})) {
        if (!x || !x.name) continue;
        if (replace || newer(videos[id], x)) { videos[id] = x; if (db) await db.collection("videos").doc(id).set(x); nV++; }
      }
      if (!db) persistLocal();
      setStatus(st, T("bkDone", { n: nS, v: nV }), "ok");
    } catch (err) { setStatus(st, T("stSaveFail", { e: err?.message || err }), "err"); }
    renderVarFields(); renderKeys(); renderEvents(); drawTimeline(); renderSessions(); renderLib();
  }

  // ---------- 盲评模式 ----------
  let blindOn = ls.get("oc_blind") === "1";
  function applyBlind() {
    $("blind-toggle").checked = blindOn;
    $("rel-blind").hidden = !blindOn;
    [...$("tab-rel").children].forEach((el) => { if (el.id !== "rel-blind") el.hidden = blindOn; });
    if (!$("tab-res").hidden) renderSessions();
    if (!$("tab-lib").hidden) renderLib();
    if (!$("tab-rel").hidden && !blindOn) renderRelOptions();
  }
  $("blind-toggle").onchange = () => { blindOn = $("blind-toggle").checked; ls.set("oc_blind", blindOn ? "1" : "0"); applyBlind(); };
  $("coder").addEventListener("change", () => { if (blindOn) applyBlind(); });

  // ---------- 启动 ----------
  try {
    const le = JSON.parse(ls.get("oc_eth") || "null"); if (le?.behaviors?.length) eth = le;
    sessions = JSON.parse(ls.get("oc_sessions") || "{}") || {};
    videos = JSON.parse(ls.get("oc_videos") || "{}") || {};
  } catch {}
  applyStatic();
  $("lang").onchange = () => {
    lang = $("lang").value; ls.set("oc_lang", lang);
    applyStatic();
    $("play").textContent = player.paused ? T("play") : T("pause");
    if (!clock.running) $("clock-start").textContent = T("clockStart");
    $("clock-pause").textContent = clock.running || !clock.base ? T("pause") : T("resume");
    setPrompt(scanOpen);
    renderKeys(); renderEvents(); drawTimeline();
    if (!$("tab-eth").hidden) renderEth();
    if (!$("tab-res").hidden) renderSessions();
    if (!$("tab-rel").hidden) renderRelOptions();
    if (!$("tab-lib").hidden) renderLib();
    drawRoi();
  };
  renderVarFields(); applyBlind();
  setMode("video"); resetClock(); renderEvents(); requestAnimationFrame(loop);

  (async () => {
    const api = window.claude;
    if (api?.use) [db, downloads] = await Promise.all(["db", "downloads"].map((n) => api.use(n).catch(() => null)));
    if (!db) { if (standalone) setStatus($("save-status"), T("stLocal")); else setStatus($("save-status"), T("stNoStore"), "err"); return; }
    db.doc("config/ethogram").onSnapshot((snap) => {
      const d = snap.exists && snap.data();
      if (d && Array.isArray(d.behaviors) && d.behaviors.length) { eth = d; ethDraft = null; renderVarFields(); renderKeys(); drawTimeline(); if (!$("tab-eth").hidden) renderEth(); }
    });
    db.collection("sessions").onSnapshot((snap) => {
      const next = {}; snap.docs.forEach((d) => { const x = d.data(); if (x && Array.isArray(x.events)) next[d.id] = x; });
      if (cur && next[cur.id] && saveT) next[cur.id] = cur;   // 本地还没存的改动优先
      sessions = next;
      if (!$("tab-res").hidden) renderSoon(renderSessions);
      if (!$("tab-lib").hidden) renderSoon(renderLib);
    }, (err) => { setStatus($("save-status"), T("stReadFail", { c: err.code }), "err"); db = null; });
    db.collection("videos").onSnapshot((snap) => {
      const next = {}; snap.docs.forEach((d) => { const x = d.data(); if (x && x.name) next[d.id] = x; });
      videos = next;
      if (!$("tab-lib").hidden) renderSoon(renderLib);
    });
  })();
})();
</script>
